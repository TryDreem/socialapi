version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: socialapi_db
    restart: always
    environment:
      POSTGRES_USER: vlad
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: socialapi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: socialapi_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
  celery_worker:
    build: .
    container_name: socialapi_celery
    restart: always
    command: celery -A app.celery_app worker --loglevel=info
    depends_on:
      - redis
      - postgres
    environment:
      DATABASE_URL: "postgresql+asyncpg://vlad:1234@postgres:5432/socialapi"
      REDIS_URL: "redis://redis:6379"
      SECRET_KEY: "34c78a333215da001ec1d95a6ad15b7122d699291660d1ef9a119bf4064459a7"
      MAILGUN_API_KEY: "your-mailgun-api-key"
      MAILGUN_DOMAIN: "your-mailgun-domain"
      ENV_STATE: "dev"
      DEBUG: "True"
  api:
    build: .
    container_name: socialapi_api
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: "postgresql+asyncpg://vlad:1234@postgres:5432/socialapi"
      REDIS_URL: "redis://redis:6379"
      SECRET_KEY: "34c78a333215da001ec1d95a6ad15b7122d699291660d1ef9a119bf4064459a7"
      ENV_STATE: "dev"
      DEBUG: "True"

volumes:
  postgres_data:
  redis_data:

